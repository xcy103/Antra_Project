spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${PAYMENT_DB_USER:payment_svc}
    password: ${PAYMENT_DB_PASSWORD:payment_svc}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789abcdef}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    com.bookstore: INFO
