# Full local stack: one PostgreSQL (a database per service), a single-node Kafka,
# and all eight Spring Boot services built from the shared multi-stage Dockerfile.
#
#   docker compose up --build        # first build is slow (each image runs mvn)
#   curl localhost:8080/actuator/health   # everything is reached via the gateway
#
# AWS-backed book-service features (browsing history, covers) need real AWS creds;
# without them those calls fail best-effort and the rest of the stack still runs.

x-service-build: &service-build
  build:
    context: .
    dockerfile: Dockerfile

x-common-env: &common-env
  CONFIG_SERVER_URL: http://config-server:8888
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please-0123456789abcdef}
  # Keep each JVM small so the whole stack fits in a modest Docker VM.
  JAVA_TOOL_OPTIONS: "-Xmx256m"

services:
  postgres:
    image: postgres:16
    container_name: bookstore-platform-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:-postgres}
    volumes:
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: bookstore-platform-kafka
    ports:
      - "29092:29092"   # host access (in-compose services use kafka:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  config-server:
    <<: *service-build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: config-server
    ports:
      - "8888:8888"

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    environment:
      <<: *common-env
      USER_DB_URL: jdbc:postgresql://postgres:5432/userdb
      USER_DB_USER: user_svc
      USER_DB_PASSWORD: user_svc
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started

  book-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: book-service
    environment:
      <<: *common-env
      BOOK_DB_URL: jdbc:postgresql://postgres:5432/bookdb
      BOOK_DB_USER: book_svc
      BOOK_DB_PASSWORD: book_svc
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    environment:
      <<: *common-env
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/orderdb
      ORDER_DB_USER: order_svc
      ORDER_DB_PASSWORD: order_svc
      BOOK_SERVICE_URL: http://book-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      book-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    environment:
      <<: *common-env
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      PAYMENT_DB_USER: payment_svc
      PAYMENT_DB_PASSWORD: payment_svc
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    environment:
      <<: *common-env
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notificationdb
      NOTIFICATION_DB_USER: notification_svc
      NOTIFICATION_DB_PASSWORD: notification_svc
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: analytics-service
    environment:
      <<: *common-env
      ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/analyticsdb
      ANALYTICS_DB_USER: analytics_svc
      ANALYTICS_DB_PASSWORD: analytics_svc
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please-0123456789abcdef}
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      USER_SERVICE_URI: http://user-service:8081
      BOOK_SERVICE_URI: http://book-service:8082
      ORDER_SERVICE_URI: http://order-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8084
    ports:
      - "8080:8080"   # the single public entry point
    depends_on:
      - user-service
      - book-service
      - order-service
      - payment-service

volumes:
  pgdata:
