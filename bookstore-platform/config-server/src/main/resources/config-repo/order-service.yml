# order-service configuration served by config-server.
server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${ORDER_DB_USER:order_svc}
    password: ${ORDER_DB_PASSWORD:order_svc}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          book-service:
            connect-timeout: 2000
            read-timeout: 2000

book-service:
  url: ${BOOK_SERVICE_URL:http://localhost:8082}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s

bookstore:
  config-source: config-server (order-service.yml)
