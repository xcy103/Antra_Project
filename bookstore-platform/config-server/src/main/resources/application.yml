server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    # 'native' serves plain files from the classpath config-repo. In a real
    # deployment this is typically a Git-backed repo instead.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/

management:
  endpoints:
    web:
      exposure:
        include: health
