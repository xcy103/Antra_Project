spring:
  application:
    name: book-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  datasource:
    url: ${BOOK_DB_URL:jdbc:postgresql://localhost:5432/bookdb}
    username: ${BOOK_DB_USER:book_svc}
    password: ${BOOK_DB_PASSWORD:book_svc}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

# JWT secret is shared across services (same value in every service). Must come
# from the environment in any real deployment; the default is local-dev only.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789abcdef}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    com.bookstore: INFO

# AWS / DynamoDB for browsing history. Real AWS: leave endpoint empty and rely on
# the SDK default credential chain. Dev/test (LocalStack): set aws.dynamodb.endpoint.
aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    browsing-history-table: ${BROWSING_HISTORY_TABLE:UserBrowsingHistory}
    cover-metadata-table: ${COVER_METADATA_TABLE:CoverMetadata}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    bucket: ${COVER_BUCKET:bookstore-covers}
    upload-url-ttl-minutes: 10

bookstore:
  browsing-history:
    ttl-days: 30
