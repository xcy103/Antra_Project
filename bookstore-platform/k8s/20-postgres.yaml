# PostgreSQL with a database per service. Ephemeral storage (emptyDir) — fine for
# a demo; a real cluster would use a StatefulSet + PersistentVolumeClaim.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: bookstore
data:
  init-databases.sql: |
    CREATE USER user_svc WITH PASSWORD 'user_svc';
    CREATE DATABASE userdb OWNER user_svc;
    CREATE USER book_svc WITH PASSWORD 'book_svc';
    CREATE DATABASE bookdb OWNER book_svc;
    CREATE USER order_svc WITH PASSWORD 'order_svc';
    CREATE DATABASE orderdb OWNER order_svc;
    CREATE USER payment_svc WITH PASSWORD 'payment_svc';
    CREATE DATABASE paymentdb OWNER payment_svc;
    CREATE USER notification_svc WITH PASSWORD 'notification_svc';
    CREATE DATABASE notificationdb OWNER notification_svc;
    CREATE USER analytics_svc WITH PASSWORD 'analytics_svc';
    CREATE DATABASE analyticsdb OWNER analytics_svc;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bookstore
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: postgres
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bookstore
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
