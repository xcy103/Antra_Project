# Backend services. All identical apart from name/image: they listen on 8080,
# take config+secrets via envFrom, and wire liveness/readiness probes to Actuator.
# Images are built from the repo Dockerfile and loaded into the cluster
# (see k8s/README.md); imagePullPolicy IfNotPresent uses the local image.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: bookstore
  labels: { app: config-server }
spec:
  replicas: 1
  selector: { matchLabels: { app: config-server } }
  template:
    metadata:
      labels: { app: config-server }
    spec:
      containers:
        - name: config-server
          image: bookstore/config-server:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: platform-config }
            - secretRef: { name: platform-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { cpu: "500m", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: config-server, namespace: bookstore }
spec:
  selector: { app: config-server }
  ports: [{ port: 8080, targetPort: 8080 }]
