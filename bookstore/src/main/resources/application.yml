spring:
  application:
    name: bookstore

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:bookstore}
    username: ${POSTGRES_USER:bookstore}
    password: ${POSTGRES_PASSWORD:bookstore}

  jpa:
    # Schema is owned by Flyway; Hibernate only validates that entities match it.
    hibernate:
      ddl-auto: validate
    # Force fetching decisions into the service layer instead of the view.
    open-in-view: false

  flyway:
    enabled: true

# JWT signing secret and token lifetime. The secret MUST come from the environment
# in any real deployment; the default below is a local-dev-only placeholder.
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789abcdef}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: 8080

# Phase 2: only the health endpoint is exposed. More endpoints arrive in later phases.
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    com.bookstore: INFO
