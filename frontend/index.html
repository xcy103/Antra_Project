<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookstore — Capstone Client</title>
  <!--
    Single-file React client for the Bookstore microservices platform.
    No build step: React + Babel are loaded from a CDN and JSX is transpiled
    in the browser. It talks only to the API Gateway (default http://localhost:8080),
    which routes to user / book / order / payment services and enforces JWT auth.
    See frontend/README.md for how to run it.
  -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f1420; --panel: #1a2233; --panel2: #222c42; --border: #2c3852;
      --text: #e6ecf5; --muted: #93a0b8; --accent: #5b8cff; --accent2: #38b58a;
      --danger: #e5674f; --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); }
    header {
      display: flex; align-items: center; gap: 16px; padding: 14px 24px;
      background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5;
    }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
    header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
    .gw { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .gw input { width: 210px; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
    .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: start; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .card h2 { margin: 0 0 14px; font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input, select {
      width: 100%; padding: 9px 11px; background: var(--panel2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 14px;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button {
      cursor: pointer; border: none; border-radius: 8px; padding: 9px 14px; font-size: 14px;
      font-weight: 600; background: var(--accent); color: #fff; transition: filter .12s;
    }
    button:hover { filter: brightness(1.08); }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 500; }
    button.mini { padding: 4px 10px; font-size: 12px; }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; align-items: center; }
    .tabs { display: flex; gap: 8px; margin-bottom: 4px; }
    .tabs button { background: transparent; color: var(--muted); border: 1px solid transparent; }
    .tabs button.active { color: var(--text); border-color: var(--border); background: var(--panel); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .book { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .book:last-child { border-bottom: none; }
    .book .meta { color: var(--muted); font-size: 12px; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .pill.PENDING { background: #4a3d18; color: #e7c86b; }
    .pill.PAID, .pill.COMPLETED, .pill.SUCCESS { background: #16402f; color: #59d6a3; }
    .pill.CANCELLED, .pill.FAILED { background: #4a2320; color: #f0917d; }
    .toast {
      position: fixed; bottom: 22px; right: 22px; max-width: 380px; padding: 12px 16px;
      border-radius: 10px; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.4); z-index: 50;
    }
    .toast.ok { background: #16402f; color: #a7f0cf; border: 1px solid #2f6a4f; }
    .toast.err { background: #4a2320; color: #f6c3b6; border: 1px solid #7a3b32; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); font-style: italic; padding: 10px 0; }
    code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback } = React;

    // ---- API layer -----------------------------------------------------------
    // Everything goes through the API Gateway. Persist the base URL + token so a
    // page reload keeps you logged in (mirrors a real SPA).
    const store = {
      get gateway() { return localStorage.getItem("gw") || "http://localhost:8080"; },
      set gateway(v) { localStorage.setItem("gw", v); },
      get token() { return localStorage.getItem("jwt") || ""; },
      set token(v) { v ? localStorage.setItem("jwt", v) : localStorage.removeItem("jwt"); },
      get username() { return localStorage.getItem("username") || ""; },
      set username(v) { v ? localStorage.setItem("username", v) : localStorage.removeItem("username"); },
    };

    async function api(path, { method = "GET", body, auth = true } = {}) {
      const headers = { "Content-Type": "application/json" };
      if (auth && store.token) headers["Authorization"] = "Bearer " + store.token;
      const res = await fetch(store.gateway + path, {
        method, headers, body: body ? JSON.stringify(body) : undefined,
      });
      const text = await res.text();
      const data = text ? (() => { try { return JSON.parse(text); } catch { return text; } })() : null;
      if (!res.ok) {
        const msg = (data && data.message) || (typeof data === "string" && data) || (res.status + " " + res.statusText);
        throw new Error(msg);
      }
      return data;
    }

    // ---- Small helpers -------------------------------------------------------
    const money = (n) => "$" + Number(n).toFixed(2);
    function Pill({ value }) { return <span className={"pill " + value}>{value}</span>; }

    // ---- Auth panel ----------------------------------------------------------
    function AuthPanel({ onAuthed, notify }) {
      const [mode, setMode] = useState("login");
      const [f, setF] = useState({ username: "", email: "", password: "" });
      const [busy, setBusy] = useState(false);
      const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

      const submit = async (e) => {
        e.preventDefault();
        setBusy(true);
        try {
          if (mode === "register") {
            await api("/api/auth/register", { method: "POST", auth: false,
              body: { username: f.username, email: f.email, password: f.password } });
            notify("ok", "Registered — logging you in…");
          }
          const res = await api("/api/auth/login", { method: "POST", auth: false,
            body: { username: f.username, password: f.password } });
          store.token = res.token;
          store.username = f.username;
          onAuthed(f.username);
          notify("ok", "Signed in as " + f.username);
        } catch (err) {
          notify("err", err.message);
        } finally { setBusy(false); }
      };

      return (
        <div className="card">
          <h2>Account</h2>
          <div className="tabs">
            <button className={mode === "login" ? "active" : ""} onClick={() => setMode("login")}>Log in</button>
            <button className={mode === "register" ? "active" : ""} onClick={() => setMode("register")}>Register</button>
          </div>
          <form onSubmit={submit}>
            <label>Username</label>
            <input value={f.username} onChange={set("username")} required autoComplete="username" />
            {mode === "register" && <>
              <label>Email</label>
              <input type="email" value={f.email} onChange={set("email")} required />
            </>}
            <label>Password</label>
            <input type="password" value={f.password} onChange={set("password")} required autoComplete="current-password" />
            <div style={{ marginTop: 14 }}>
              <button disabled={busy}>{mode === "register" ? "Create account" : "Log in"}</button>
            </div>
          </form>
          <p className="muted" style={{ fontSize: 12, marginBottom: 0 }}>
            New accounts get the <code>USER</code> role. Seed an <code>ADMIN</code> in the DB to manage the catalog.
          </p>
        </div>
      );
    }

    // ---- Catalog + cart ------------------------------------------------------
    function Catalog({ notify, onOrdered }) {
      const [books, setBooks] = useState([]);
      const [cart, setCart] = useState({}); // bookId -> qty
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        setLoading(true);
        try { setBooks(await api("/api/books", { auth: false })); }
        catch (err) { notify("err", "Load books: " + err.message); }
        finally { setLoading(false); }
      }, [notify]);
      useEffect(() => { load(); }, [load]);

      const add = (id) => setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 }));
      const sub = (id) => setCart((c) => {
        const q = (c[id] || 0) - 1; const n = { ...c };
        if (q <= 0) delete n[id]; else n[id] = q; return n;
      });
      const view = async (id) => {
        // Fetching a single book records a browsing-history event when authenticated.
        try { const b = await api("/api/books/" + id, { auth: !!store.token }); notify("ok", "Viewed: " + b.title); }
        catch (err) { notify("err", err.message); }
      };

      const lines = Object.entries(cart).map(([id, qty]) => {
        const b = books.find((x) => String(x.id) === id); return b ? { b, qty } : null;
      }).filter(Boolean);
      const total = lines.reduce((s, { b, qty }) => s + Number(b.price) * qty, 0);

      const placeOrder = async () => {
        try {
          const order = await api("/api/orders", { method: "POST",
            body: { items: lines.map(({ b, qty }) => ({ bookId: b.id, quantity: qty })) } });
          setCart({});
          notify("ok", "Order #" + order.id + " placed (" + money(order.totalPrice) + ")");
          onOrdered();
          load(); // refresh stock
        } catch (err) { notify("err", "Place order: " + err.message); }
      };

      return (
        <div className="card">
          <div className="row" style={{ justifyContent: "space-between" }}>
            <h2 style={{ margin: 0 }}>Catalog</h2>
            <button className="ghost mini" onClick={load}>Refresh</button>
          </div>
          {loading ? <p className="empty">Loading…</p> :
            books.length === 0 ? <p className="empty">No books. Add some as an admin.</p> :
            books.map((b) => (
              <div className="book" key={b.id}>
                <div>
                  <div><strong>{b.title}</strong></div>
                  <div className="meta">{b.authorName} · ISBN {b.isbn} · stock {b.stock}</div>
                </div>
                <div className="row">
                  <span style={{ minWidth: 60, textAlign: "right" }}>{money(b.price)}</span>
                  <button className="ghost mini" onClick={() => view(b.id)}>View</button>
                  <div className="row" style={{ gap: 4 }}>
                    <button className="ghost mini" onClick={() => sub(b.id)} disabled={!cart[b.id]}>−</button>
                    <span style={{ minWidth: 16, textAlign: "center" }}>{cart[b.id] || 0}</span>
                    <button className="mini" onClick={() => add(b.id)} disabled={b.stock <= (cart[b.id] || 0)}>+</button>
                  </div>
                </div>
              </div>
            ))}
          {lines.length > 0 && (
            <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid var(--border)" }}>
              <div className="row" style={{ justifyContent: "space-between" }}>
                <strong>Cart total: {money(total)}</strong>
                <button onClick={placeOrder} disabled={!store.token}>
                  {store.token ? "Place order" : "Log in to order"}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ---- Orders + payment ----------------------------------------------------
    function Orders({ notify, refreshKey }) {
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        if (!store.token) { setOrders([]); setLoading(false); return; }
        setLoading(true);
        try { setOrders(await api("/api/orders")); }
        catch (err) { notify("err", "Load orders: " + err.message); }
        finally { setLoading(false); }
      }, [notify]);
      useEffect(() => { load(); }, [load, refreshKey]);

      const pay = async (o) => {
        try {
          const p = await api("/api/payments", { method: "POST",
            body: { orderId: o.id, amount: o.totalPrice } });
          notify("ok", "Payment " + p.status + " for order #" + o.id);
          load();
        } catch (err) { notify("err", "Payment: " + err.message); }
      };
      const cancel = async (o) => {
        try { await api("/api/orders/" + o.id + "/cancel", { method: "PUT" });
          notify("ok", "Order #" + o.id + " cancelled"); load(); }
        catch (err) { notify("err", "Cancel: " + err.message); }
      };

      if (!store.token) return null;
      return (
        <div className="card">
          <div className="row" style={{ justifyContent: "space-between" }}>
            <h2 style={{ margin: 0 }}>My orders</h2>
            <button className="ghost mini" onClick={load}>Refresh</button>
          </div>
          {loading ? <p className="empty">Loading…</p> :
            orders.length === 0 ? <p className="empty">No orders yet.</p> :
            <table>
              <thead><tr><th>#</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
              <tbody>
                {orders.map((o) => (
                  <tr key={o.id}>
                    <td>{o.id}</td>
                    <td className="muted">{o.items.reduce((s, i) => s + i.quantity, 0)} item(s)</td>
                    <td>{money(o.totalPrice)}</td>
                    <td><Pill value={o.status} /></td>
                    <td className="row" style={{ gap: 6, borderBottom: "none" }}>
                      {o.status === "PENDING" && <>
                        <button className="mini" onClick={() => pay(o)}>Pay</button>
                        <button className="ghost mini danger" onClick={() => cancel(o)}>Cancel</button>
                      </>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>}
        </div>
      );
    }

    // ---- Browsing history ----------------------------------------------------
    function History({ notify, refreshKey }) {
      const [rows, setRows] = useState([]);
      const load = useCallback(async () => {
        if (!store.token) return;
        try { setRows(await api("/api/books/me/history")); }
        catch (err) { /* history is best-effort; DynamoDB may be off locally */ }
      }, []);
      useEffect(() => { load(); }, [load, refreshKey]);
      if (!store.token || rows.length === 0) return null;
      return (
        <div className="card">
          <h2>Recently viewed</h2>
          {rows.map((r, i) => (
            <div className="book" key={i}>
              <div><strong>{r.title || ("Book #" + r.bookId)}</strong></div>
              <div className="meta">{r.viewedAt || ""}</div>
            </div>
          ))}
        </div>
      );
    }

    // ---- Root ----------------------------------------------------------------
    function App() {
      const [user, setUser] = useState(store.username);
      const [gw, setGw] = useState(store.gateway);
      const [toast, setToast] = useState(null);
      const [ordersKey, setOrdersKey] = useState(0);

      const notify = useCallback((kind, msg) => {
        setToast({ kind, msg });
        setTimeout(() => setToast(null), 3500);
      }, []);
      const bumpOrders = () => setOrdersKey((k) => k + 1);

      const logout = () => { store.token = ""; store.username = ""; setUser(""); notify("ok", "Signed out"); };
      const saveGw = (v) => { setGw(v); store.gateway = v; };

      return (
        <>
          <header>
            <h1>📚 Bookstore</h1>
            <div className="gw">
              gateway <input value={gw} onChange={(e) => saveGw(e.target.value)} />
            </div>
            <div className="who">
              {user ? <span>signed in as <strong>{user}</strong> · <a href="#" onClick={(e) => { e.preventDefault(); logout(); }}>log out</a></span>
                    : <span>not signed in</span>}
            </div>
          </header>
          <main>
            <div className="grid2">
              <div style={{ display: "grid", gap: 24 }}>
                <Catalog notify={notify} onOrdered={bumpOrders} />
                <Orders notify={notify} refreshKey={ordersKey} />
              </div>
              <div style={{ display: "grid", gap: 24 }}>
                {!user && <AuthPanel notify={notify} onAuthed={setUser} />}
                {user && <div className="card">
                  <h2>Session</h2>
                  <p className="muted" style={{ marginTop: 0 }}>JWT is stored in <code>localStorage</code> and sent as a Bearer token on every gateway call.</p>
                  <button className="ghost" onClick={logout}>Log out</button>
                </div>}
                <History notify={notify} refreshKey={ordersKey} />
              </div>
            </div>
          </main>
          {toast && <div className={"toast " + toast.kind}>{toast.msg}</div>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
