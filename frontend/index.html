<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookstore — Capstone Client</title>
  <!--
    Single-file demo client for the Bookstore microservices platform.
    Zero dependencies: plain HTML/CSS/JS, no build step and no external scripts,
    so it runs by just opening this file (file://) with no network beyond the API.
    It talks only to the API Gateway (default http://localhost:8080), which routes
    to user / book / order / payment services and enforces JWT auth.
    See frontend/README.md for how to run it.
  -->
  <style>
    :root {
      --bg: #0f1420; --panel: #1a2233; --panel2: #222c42; --border: #2c3852;
      --text: #e6ecf5; --muted: #93a0b8; --accent: #5b8cff; --accent2: #38b58a;
      --danger: #e5674f; --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); }
    header {
      display: flex; align-items: center; gap: 16px; padding: 14px 24px;
      background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5;
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
    header .who { margin-left: auto; color: var(--muted); font-size: 13px; }
    .gw { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .gw input { width: 210px; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
    .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: start; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    .col { display: grid; gap: 24px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .card h2 { margin: 0 0 14px; font-size: 15px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input, select {
      width: 100%; padding: 9px 11px; background: var(--panel2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; outline: none; font-size: 14px;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button {
      cursor: pointer; border: none; border-radius: 8px; padding: 9px 14px; font-size: 14px;
      font-weight: 600; background: var(--accent); color: #fff; transition: filter .12s;
    }
    button:hover { filter: brightness(1.08); }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 500; }
    button.mini { padding: 4px 10px; font-size: 12px; }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; align-items: center; }
    .between { justify-content: space-between; }
    .tabs { display: flex; gap: 8px; margin-bottom: 4px; }
    .tabs button { background: transparent; color: var(--muted); border: 1px solid transparent; }
    .tabs button.active { color: var(--text); border-color: var(--border); background: var(--panel); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .book { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    .book:last-child { border-bottom: none; }
    .book .meta { color: var(--muted); font-size: 12px; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .pill.PENDING { background: #4a3d18; color: #e7c86b; }
    .pill.PAID, .pill.COMPLETED, .pill.SUCCESS { background: #16402f; color: #59d6a3; }
    .pill.CANCELLED, .pill.FAILED { background: #4a2320; color: #f0917d; }
    .toast {
      position: fixed; bottom: 22px; right: 22px; max-width: 380px; padding: 12px 16px;
      border-radius: 10px; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.4); z-index: 50;
    }
    .toast.ok { background: #16402f; color: #a7f0cf; border: 1px solid #2f6a4f; }
    .toast.err { background: #4a2320; color: #f6c3b6; border: 1px solid #7a3b32; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); font-style: italic; padding: 10px 0; }
    code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
    .qty { display: flex; gap: 4px; align-items: center; }
    .qty span { min-width: 16px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Bookstore</h1>
    <div class="gw">gateway <input id="gw" /></div>
    <div class="who" id="who"></div>
  </header>
  <main>
    <div class="grid2">
      <div class="col">
        <section class="card" id="catalog"></section>
        <section class="card" id="orders" hidden></section>
      </div>
      <div class="col">
        <section class="card" id="account"></section>
        <section class="card" id="history" hidden></section>
      </div>
    </div>
  </main>
  <div id="toast" class="toast" hidden></div>

  <script>
  (function () {
    "use strict";

    // ---- persistent state ----------------------------------------------------
    var store = {
      get gateway() { return localStorage.getItem("gw") || "http://localhost:8080"; },
      set gateway(v) { localStorage.setItem("gw", v); },
      get token() { return localStorage.getItem("jwt") || ""; },
      set token(v) { v ? localStorage.setItem("jwt", v) : localStorage.removeItem("jwt"); },
      get username() { return localStorage.getItem("username") || ""; },
      set username(v) { v ? localStorage.setItem("username", v) : localStorage.removeItem("username"); }
    };

    var state = { books: [], cart: {}, orders: [], history: [], authMode: "login" };

    // ---- helpers -------------------------------------------------------------
    function el(id) { return document.getElementById(id); }
    function money(n) { return "$" + Number(n).toFixed(2); }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    var toastTimer;
    function notify(kind, msg) {
      var t = el("toast");
      t.className = "toast " + kind; t.textContent = msg; t.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.hidden = true; }, 3500);
    }

    async function api(path, opts) {
      opts = opts || {};
      var headers = { "Content-Type": "application/json" };
      if (opts.auth !== false && store.token) headers["Authorization"] = "Bearer " + store.token;
      var res, text;
      try {
        res = await fetch(store.gateway + path, {
          method: opts.method || "GET", headers: headers,
          body: opts.body ? JSON.stringify(opts.body) : undefined
        });
      } catch (e) {
        throw new Error("Cannot reach the gateway at " + store.gateway + " — is the stack up?");
      }
      text = await res.text();
      var data = null;
      if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
      if (!res.ok) {
        var msg = (data && data.message) || (typeof data === "string" && data) || (res.status + " " + res.statusText);
        throw new Error(msg);
      }
      return data;
    }

    // ---- header + account ----------------------------------------------------
    function renderHeader() {
      el("gw").value = store.gateway;
      var who = el("who");
      if (store.username) {
        who.innerHTML = 'signed in as <strong>' + esc(store.username) + '</strong> · <a href="#" id="logout">log out</a>';
        el("logout").onclick = function (e) { e.preventDefault(); logout(); };
      } else {
        who.textContent = "not signed in";
      }
    }

    function renderAccount() {
      var box = el("account");
      if (store.username) {
        box.innerHTML =
          '<h2>Session</h2>' +
          '<p class="muted" style="margin-top:0">JWT is stored in <code>localStorage</code> and sent as a Bearer token on every gateway call.</p>' +
          '<button class="ghost" id="logout2">Log out</button>';
        el("logout2").onclick = logout;
        return;
      }
      var m = state.authMode;
      box.innerHTML =
        '<h2>Account</h2>' +
        '<div class="tabs">' +
          '<button data-mode="login" class="' + (m === "login" ? "active" : "") + '">Log in</button>' +
          '<button data-mode="register" class="' + (m === "register" ? "active" : "") + '">Register</button>' +
        '</div>' +
        '<form id="authForm">' +
          '<label>Username</label><input name="username" autocomplete="username" required />' +
          (m === "register" ? '<label>Email</label><input name="email" type="email" required />' : '') +
          '<label>Password</label><input name="password" type="password" autocomplete="current-password" required />' +
          '<div style="margin-top:14px"><button type="submit">' + (m === "register" ? "Create account" : "Log in") + '</button></div>' +
        '</form>' +
        '<p class="muted" style="font-size:12px;margin-bottom:0">New accounts get the <code>USER</code> role. Promote to <code>ADMIN</code> via the seed script to manage the catalog.</p>';
      Array.prototype.forEach.call(box.querySelectorAll(".tabs button"), function (b) {
        b.onclick = function () { state.authMode = b.getAttribute("data-mode"); renderAccount(); };
      });
      el("authForm").onsubmit = onAuthSubmit;
    }

    async function onAuthSubmit(e) {
      e.preventDefault();
      var f = e.target, mode = state.authMode;
      var username = f.username.value.trim(), password = f.password.value;
      var btn = f.querySelector("button[type=submit]"); btn.disabled = true;
      try {
        if (mode === "register") {
          await api("/api/auth/register", { method: "POST", auth: false,
            body: { username: username, email: f.email.value.trim(), password: password } });
          notify("ok", "Registered — logging you in…");
        }
        var res = await api("/api/auth/login", { method: "POST", auth: false,
          body: { username: username, password: password } });
        store.token = res.token; store.username = username;
        notify("ok", "Signed in as " + username);
        await refreshAll();
      } catch (err) {
        notify("err", err.message); btn.disabled = false;
      }
    }

    function logout() {
      store.token = ""; store.username = "";
      state.orders = []; state.history = [];
      notify("ok", "Signed out");
      renderAll();
    }

    // ---- catalog + cart ------------------------------------------------------
    async function loadBooks() {
      try { state.books = await api("/api/books", { auth: false }) || []; }
      catch (err) { notify("err", "Load books: " + err.message); state.books = []; }
    }

    function renderCatalog() {
      var box = el("catalog");
      var lines = cartLines();
      var total = lines.reduce(function (s, l) { return s + Number(l.b.price) * l.qty; }, 0);
      var rows = state.books.length === 0
        ? '<p class="empty">No books. Run scripts/seed-demo.sh to add some.</p>'
        : state.books.map(function (b) {
            var inCart = state.cart[b.id] || 0;
            return '<div class="book">' +
              '<div><div><strong>' + esc(b.title) + '</strong></div>' +
              '<div class="meta">' + esc(b.authorName) + ' · ISBN ' + esc(b.isbn) + ' · stock ' + b.stock + '</div></div>' +
              '<div class="row">' +
                '<span style="min-width:60px;text-align:right">' + money(b.price) + '</span>' +
                '<button class="ghost mini" data-act="view" data-id="' + b.id + '">View</button>' +
                '<div class="qty">' +
                  '<button class="ghost mini" data-act="sub" data-id="' + b.id + '"' + (inCart ? '' : ' disabled') + '>−</button>' +
                  '<span>' + inCart + '</span>' +
                  '<button class="mini" data-act="add" data-id="' + b.id + '"' + (b.stock <= inCart ? ' disabled' : '') + '>+</button>' +
                '</div>' +
              '</div></div>';
          }).join("");
      box.innerHTML =
        '<div class="row between"><h2 style="margin:0">Catalog</h2><button class="ghost mini" id="reloadBooks">Refresh</button></div>' +
        rows +
        (lines.length ? (
          '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)" class="row between">' +
            '<strong>Cart total: ' + money(total) + '</strong>' +
            '<button id="placeOrder"' + (store.token ? '' : ' disabled') + '>' + (store.token ? "Place order" : "Log in to order") + '</button>' +
          '</div>'
        ) : '');

      el("reloadBooks").onclick = async function () { await loadBooks(); renderCatalog(); };
      Array.prototype.forEach.call(box.querySelectorAll("button[data-act]"), function (b) {
        b.onclick = function () { onCatalogAction(b.getAttribute("data-act"), Number(b.getAttribute("data-id"))); };
      });
      if (el("placeOrder")) el("placeOrder").onclick = placeOrder;
    }

    function cartLines() {
      return Object.keys(state.cart).map(function (id) {
        var b = state.books.filter(function (x) { return String(x.id) === id; })[0];
        return b ? { b: b, qty: state.cart[id] } : null;
      }).filter(Boolean);
    }

    async function onCatalogAction(act, id) {
      if (act === "add") { state.cart[id] = (state.cart[id] || 0) + 1; renderCatalog(); }
      else if (act === "sub") {
        var q = (state.cart[id] || 0) - 1;
        if (q <= 0) delete state.cart[id]; else state.cart[id] = q;
        renderCatalog();
      } else if (act === "view") {
        try { var b = await api("/api/books/" + id, { auth: !!store.token }); notify("ok", "Viewed: " + b.title); loadHistory(); }
        catch (err) { notify("err", err.message); }
      }
    }

    async function placeOrder() {
      var lines = cartLines();
      try {
        var order = await api("/api/orders", { method: "POST",
          body: { items: lines.map(function (l) { return { bookId: l.b.id, quantity: l.qty }; }) } });
        state.cart = {};
        notify("ok", "Order #" + order.id + " placed (" + money(order.totalPrice) + ")");
        await loadBooks(); await loadOrders();
        renderCatalog(); renderOrders();
      } catch (err) { notify("err", "Place order: " + err.message); }
    }

    // ---- orders --------------------------------------------------------------
    async function loadOrders() {
      if (!store.token) { state.orders = []; return; }
      try { state.orders = await api("/api/orders") || []; }
      catch (err) { notify("err", "Load orders: " + err.message); }
    }

    function renderOrders() {
      var box = el("orders");
      if (!store.token) { box.hidden = true; return; }
      box.hidden = false;
      var body = state.orders.length === 0
        ? '<p class="empty">No orders yet.</p>'
        : '<table><thead><tr><th>#</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>' +
          state.orders.map(function (o) {
            var items = o.items.reduce(function (s, i) { return s + i.quantity; }, 0);
            var actions = o.status === "PENDING"
              ? '<button class="mini" data-act="pay" data-id="' + o.id + '">Pay</button> ' +
                '<button class="ghost mini danger" data-act="cancel" data-id="' + o.id + '">Cancel</button>'
              : '';
            return '<tr><td>' + o.id + '</td><td class="muted">' + items + ' item(s)</td><td>' + money(o.totalPrice) +
              '</td><td><span class="pill ' + esc(o.status) + '">' + esc(o.status) + '</span></td><td>' + actions + '</td></tr>';
          }).join("") + '</tbody></table>';
      box.innerHTML = '<div class="row between"><h2 style="margin:0">My orders</h2><button class="ghost mini" id="reloadOrders">Refresh</button></div>' + body;
      el("reloadOrders").onclick = async function () { await loadOrders(); renderOrders(); };
      Array.prototype.forEach.call(box.querySelectorAll("button[data-act]"), function (b) {
        b.onclick = function () { onOrderAction(b.getAttribute("data-act"), Number(b.getAttribute("data-id"))); };
      });
    }

    async function onOrderAction(act, id) {
      var order = state.orders.filter(function (o) { return o.id === id; })[0];
      try {
        if (act === "pay") {
          var p = await api("/api/payments", { method: "POST", body: { orderId: id, amount: order.totalPrice } });
          notify("ok", "Payment " + p.status + " for order #" + id + " — status updates shortly");
          // The order transitions PENDING -> PAID asynchronously: order-service
          // consumes the PaymentCompleted Kafka event. Re-fetch a couple of times
          // so the new status shows without a manual refresh.
          setTimeout(async function () { await loadOrders(); renderOrders(); }, 1500);
          setTimeout(async function () { await loadOrders(); renderOrders(); }, 4000);
        } else if (act === "cancel") {
          await api("/api/orders/" + id + "/cancel", { method: "PUT" });
          notify("ok", "Order #" + id + " cancelled");
        }
        await loadOrders(); renderOrders();
      } catch (err) { notify("err", (act === "pay" ? "Payment: " : "Cancel: ") + err.message); }
    }

    // ---- browsing history (best-effort; needs the DynamoDB feature) -----------
    async function loadHistory() {
      if (!store.token) { state.history = []; renderHistory(); return; }
      try { state.history = await api("/api/books/me/history") || []; } catch (e) { state.history = []; }
      renderHistory();
    }

    function renderHistory() {
      var box = el("history");
      if (!store.token || state.history.length === 0) { box.hidden = true; return; }
      box.hidden = false;
      box.innerHTML = '<h2>Recently viewed</h2>' + state.history.map(function (r) {
        return '<div class="book"><div><strong>' + esc(r.title || ("Book #" + r.bookId)) + '</strong></div>' +
          '<div class="meta">' + esc(r.viewedAt || "") + '</div></div>';
      }).join("");
    }

    // ---- orchestration -------------------------------------------------------
    function renderAll() {
      renderHeader(); renderAccount(); renderCatalog(); renderOrders(); renderHistory();
    }
    async function refreshAll() {
      await Promise.all([loadBooks(), loadOrders(), loadHistory()]);
      renderAll();
    }

    el("gw").addEventListener("change", function () {
      store.gateway = el("gw").value.trim() || "http://localhost:8080"; refreshAll();
    });

    renderAll();      // paint immediately so the page is never blank
    refreshAll();     // then load data from the gateway
  })();
  </script>
</body>
</html>
