name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Build + run the whole test suite. A failing test fails this job (pipeline red).
  #    Testcontainers works natively on the Linux runner (real Docker, no Colima quirks).
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookstore-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: bookstore-platform/**/target/site/jacoco/**
          if-no-files-found: ignore

  # 2. Build a container image per service and push to GHCR, tagged by commit SHA.
  #    Only on pushes to main, and only after the tests pass.
  build-and-push-images:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - config-server
          - user-service
          - book-service
          - order-service
          - payment-service
          - notification-service
          - analytics-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: bookstore-platform
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bookstore-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/bookstore-${{ matrix.service }}:latest

  # 3. Deploy, gated behind a manual approval. Protect the 'production' Environment
  #    in repo Settings -> Environments (required reviewers) to require a click.
  deploy:
    needs: build-and-push-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to the cluster
        run: |
          echo "Approved -> deploying images tagged ${GITHUB_SHA}."
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
            export KUBECONFIG=$PWD/kubeconfig
            kubectl apply -f bookstore-platform/k8s/
            for s in config-server user-service book-service order-service payment-service \
                     notification-service analytics-service api-gateway; do
              kubectl -n bookstore set image deployment/$s \
                $s=ghcr.io/${{ github.repository_owner }}/bookstore-$s:${GITHUB_SHA}
            done
          else
            echo "No KUBE_CONFIG secret set — this is where a real rollout would run:"
            echo "  kubectl apply -f bookstore-platform/k8s/ && kubectl set image ..."
          fi
